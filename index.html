<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="${colorPrimary}" />
    <meta name="description" content="${description}" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" sizes="180x180" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/styles.css">
    <title>${title}</title>
    <style>
      :root {
        --loader-color: ${colorPrimary};
        --loader-track: rgba(120, 132, 152, 0.2);
      }
      .loader {
        position: fixed;
        inset: 0;
        margin: auto;
        width: 54px;
        height: 54px;
        color: #4f46e5;
        border-radius: 50%;
        animation: loader-pulse 1.8s ease-in-out infinite;
      }
      .loader::before,
      .loader::after {
        content: '';
        position: absolute;
        box-sizing: border-box;
        border-radius: 50%;
      }
      .loader::before {
        inset: 0;
        border: 3px solid var(--loader-track);
        border-block-start-color: var(--loader-color);
        border-inline-start-color: var(--loader-color);
        animation: loader-spin 1.05s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }
      .loader::after {
        inset: 9px;
        border: 3px solid transparent;
        border-block-end-color: var(--loader-color);
        border-inline-end-color: var(--loader-color);
        opacity: 0.6;
        animation: loader-spin 1.55s linear infinite reverse;
      }
      @keyframes loader-spin {
        to {
          transform: rotate(1turn);
        }
      }
      @keyframes loader-pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.05);
        }
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --loader-track: rgba(255, 255, 255, 0.14);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .loader {
          animation: none;
        }
        .loader::before,
        .loader::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <noscript>Enable JavaScript to use <a href="https://www.traccar.org/">Traccar GPS Tracking System</a>.</noscript>
    <div id="root" class="root"></div>
    <div class="loader"></div>
    <script type="module" src="/src/index.jsx" onerror="alert('Loading error.')"></script>
  </body>
</html>
